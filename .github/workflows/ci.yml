# FinAgent-Nexus CI
#
# The README says production requires "a regression suite that fails the build
# when it stops working". This is that build. It is organised around the
# repository's own claims rather than the usual lint/test pair, because the
# claims are what would otherwise rot unchecked:
#
#   quality              — the ordinary gate: lint, types, tests, on every
#                          supported interpreter.
#   determinism-boundary — installs ONLY requirements.txt, so `anthropic` and
#                          `langgraph` are genuinely absent, then runs the
#                          screening endpoint and the eval harness. The in-repo
#                          subprocess test can only inspect sys.modules inside a
#                          full virtualenv; this proves the boundary against an
#                          install that could not import the SDK if it wanted to.
#   audit-integrity      — writes a trail, alters one value, and asserts the
#                          tooling refuses it. Tamper-evidence claimed and never
#                          exercised is tamper-evidence untested.
#   constitution-eval    — the golden cases, gating the merge.
#
# No job needs ANTHROPIC_API_KEY. Everything here is the deterministic half of
# the system, which is the half that must never depend on a credential.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job below is offline and deterministic, so the bundled fixture is the
  # right data source — but it is still opted into explicitly, never inherited.
  FINAGENT_ALLOW_SYNTHETIC_DATA: "true"

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Tests
        # -m "not live" is already the default in pyproject; stated here so the
        # exclusion is visible in the build log rather than implied by config.
        run: uv run pytest -m "not live" --cov --cov-report=term-missing

  determinism-boundary:
    name: deterministic half runs with no model SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ONLY the serverless dependency set
        # --no-deps is the whole point: the package's own dependency list
        # includes anthropic and langgraph, and installing them here would make
        # this job prove nothing.
        run: |
          uv venv --python 3.11
          uv pip install -r requirements.txt
          uv pip install -e . --no-deps

      - name: Assert the model stack really is absent
        run: |
          if uv run python -c "import anthropic" 2>/dev/null; then
            echo "::error::anthropic is installed; this job cannot prove anything"
            exit 1
          fi
          if uv run python -c "import langgraph" 2>/dev/null; then
            echo "::error::langgraph is installed; this job cannot prove anything"
            exit 1
          fi
          echo "confirmed: neither anthropic nor langgraph is importable"

      - name: The deployed screening endpoint answers without a credential
        run: |
          uv run python - <<'PY'
          import sys
          sys.path.insert(0, "api")
          from screen import screen

          result = screen({
              "mandate": "sharia",
              "jurisdiction": "SA",
              "allocations": [
                  {"symbol": "2222.SR", "weight_pct": 31.0},
                  {"symbol": "SUKUK.GCC", "weight_pct": 69.0},
              ],
          })
          assert result["model_calls"] == 0, result
          assert result["verdict"] in {"pass", "revise", "block"}, result
          assert result["principles_in_force"] > 0, result
          print(f"verdict={result['verdict']} over {result['principles_in_force']} principles")
          PY

      - name: The auditor's commands run on this install
        run: |
          uv run finagent eval \
            --dataset tests/eval/datasets/golden_cases.json \
            --allow-synthetic-data

  audit-integrity:
    name: a tampered trail is refused
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Write a trail
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from finagent_nexus.audit import AuditTrail

          trail = AuditTrail(correlation_id="ci-run", directory=Path("ci-audit"))
          trail.record(
              actor="Orchestrator",
              action="accept_mandate",
              detail={
                  "request": {"client_id": "CL-CI-001"},
                  "settings": {"model": "claude-opus-5"},
              },
          )
          trail.record(
              actor="WealthStrategist",
              action="synthesize",
              model="claude-opus-5",
              detail={"revision": 0, "allocations": {"SUKUK.GCC": 70.0}},
          )
          trail.record(
              actor="Orchestrator",
              action="finalize",
              status="approved",
              detail={"outcome": "approved", "revisions_used": 0},
          )
          assert trail.verify()
          print(f"wrote {trail.path}")
          PY

      - name: An intact trail verifies and replays
        run: |
          uv run finagent verify-audit ci-audit/ci-run.jsonl
          uv run finagent replay ci-audit/ci-run.jsonl

      - name: An altered trail is detected and refused
        run: |
          sed -i 's/"SUKUK.GCC":70.0/"SUKUK.GCC":40.0/' ci-audit/ci-run.jsonl
          if ! grep -q '"SUKUK.GCC":40.0' ci-audit/ci-run.jsonl; then
            echo "::error::the tamper did not apply; this job would pass vacuously"
            exit 1
          fi
          echo "tampered: 70.0 -> 40.0"

          # Both commands must reject it. `verify-audit` reports the break;
          # `replay` must additionally refuse to render, or an altered record
          # gets laundered into a tidy report.
          if uv run finagent verify-audit ci-audit/ci-run.jsonl; then
            echo "::error::verify-audit accepted a tampered trail"
            exit 1
          fi
          if uv run finagent replay ci-audit/ci-run.jsonl; then
            echo "::error::replay rendered a tampered trail"
            exit 1
          fi
          echo "confirmed: both commands refused the altered trail"

  constitution-eval:
    name: the screens still catch what they claim to
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Golden cases
        # Exits non-zero on a missed breach or a false alarm, so loosening a
        # threshold turns the build red and names the principle that moved.
        run: |
          uv run finagent eval \
            --dataset tests/eval/datasets/golden_cases.json \
            --allow-synthetic-data

      - name: Refuses to run on synthetic data without an explicit opt-in
        env:
          FINAGENT_ALLOW_SYNTHETIC_DATA: "false"
        run: |
          if uv run finagent eval --dataset tests/eval/datasets/golden_cases.json; then
            echo "::error::the eval ran on fabricated prices without being asked to"
            exit 1
          fi
          echo "confirmed: synthetic data is opt-in, never inherited"
