[project]
name = "finagent-nexus"
version = "0.1.0"
description = "Multi-Agent Financial Intelligence — agentic AI adoption for financial services"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "FinAgent-Nexus" }]

dependencies = [
    "anthropic>=0.70",
    "langgraph>=0.2.60",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
finagent = "finagent_nexus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finagent_nexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: tests that call the Claude API (deselect with '-m \"not live\"')",
]
addopts = "-m 'not live'"
